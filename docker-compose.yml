services:
  cyber-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyber-sentinel:latest
    container_name: cyber-sentinel-soc
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
